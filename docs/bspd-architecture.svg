<svg xmlns="http://www.w3.org/2000/svg" id="flowsvg" width="100%" viewBox="0 0 712 930" role="img" aria-roledescription="architecture diagram" aria-labelledby="flowsvg-title" aria-describedby="flowsvg-desc"><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; background: #020617;
         min-height: 100vh; padding: 2rem; color: #e2e8f0; }
  .container { max-width: 1100px; margin: 0 auto; }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 0.4rem; }
  .pulse-dot { width: 10px; height: 10px; border-radius: 50%; background: #22d3ee; }
  h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
  .subtitle { color: #64748b; font-size: 0.8rem; margin-bottom: 1.5rem; }
  .diagram-card { border: 1px solid #1e293b; border-radius: 12px; position: relative;
    background: repeating-linear-gradient(0deg, #0f1b33 0 0.5px, transparent 0.5px 40px),
      repeating-linear-gradient(90deg, #0f1b33 0 0.5px, transparent 0.5px 40px), #030a1c;
    padding: 1.25rem 1rem; }
  .pause-btn { position: absolute; top: 12px; right: 12px; z-index: 2; background: transparent;
    border: 1px solid #1e293b; color: #64748b; border-radius: 6px; padding: 4px 10px;
    font: inherit; font-size: 11px; cursor: pointer; }
  .pause-btn:hover { color: #e2e8f0; border-color: #334155; }
  .footer { color: #475569; font-size: 0.7rem; margin-top: 1rem; }
  .flow { stroke-dasharray: 5 5; }
  .flow-async { stroke-dasharray: 2 4; }
  .flow-auth { stroke-dasharray: 4 4; }
  @media (prefers-reduced-motion: no-preference) {
    .flow { animation: dashmove 0.75s linear infinite; }
    .flow-async { animation: dashasync 0.9s linear infinite; }
    .flow-auth { animation: dashauth 1.2s linear infinite; }
    .pulse-dot { animation: pulse 2s ease-in-out infinite; }
  }
  @keyframes dashmove { to { stroke-dashoffset: -10; } }
  @keyframes dashasync { to { stroke-dashoffset: -12; } }
  @keyframes dashauth { to { stroke-dashoffset: -8; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  body.paused .flow, body.paused .flow-async, body.paused .flow-auth,
  body.paused .pulse-dot { animation-play-state: paused; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1rem; margin-top: 1.25rem; }
  .card { border: 1px solid #1e293b; border-radius: 10px; background: #060d20; padding: 1rem 1.1rem; }
  .card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 0.6rem; }
  .card-dot { width: 8px; height: 8px; border-radius: 50%; }
  .card-dot.cyan { background: #22d3ee; } .card-dot.violet { background: #a78bfa; }
  .card-dot.rose { background: #fb7185; }
  .card h3 { font-size: 0.8rem; font-weight: 600; }
  .card ul { list-style: none; } .card li { font-size: 0.72rem; color: #94a3b8; line-height: 1.7; }

@media(prefers-reduced-motion:reduce){.dot{display:none}*{animation:none!important}}</style><rect width="100%" height="100%" fill="#020617"/><title id="flowsvg-title">ANUFS / BSPD 2026 animated diagram</title><desc id="flowsvg-desc">Top-down architecture diagram; dashed connectors animate in the direction of flow and dots ride the main paths.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g fill="none"><path class="flow" d="M263.5 90 V142" stroke="#64748b" stroke-width="1.5" opacity="1" marker-end="url(#arrow)"/><path class="flow" d="M263.5 202 V230 H133.5 V254" stroke="#64748b" stroke-width="1.5" opacity="1" marker-end="url(#arrow)"/><path class="flow" d="M263.5 202 V230 H383 V254" stroke="#64748b" stroke-width="1.5" opacity="1" marker-end="url(#arrow)"/><path class="flow" d="M133.5 314 V342 H153 V366" stroke="#64748b" stroke-width="1.5" opacity="1" marker-end="url(#arrow)"/><path class="flow" d="M383 314 V342 H388.5 V366" stroke="#64748b" stroke-width="1.5" opacity="1" marker-end="url(#arrow)"/><path class="flow" d="M153 426 V454 H263.5 V478" stroke="#64748b" stroke-width="1.5" opacity="1" marker-end="url(#arrow)"/><path class="flow" d="M388.5 426 V454 H263.5 V478" stroke="#64748b" stroke-width="1.5" opacity="1" marker-end="url(#arrow)"/><path class="flow" d="M263.5 538 V590" stroke="#64748b" stroke-width="1.5" opacity="1" marker-end="url(#arrow)"/><path class="flow" d="M263.5 650 V702" stroke="#64748b" stroke-width="1.5" opacity="1" marker-end="url(#arrow)"/><path class="flow" d="M263.5 762 V814" stroke="#64748b" stroke-width="1.5" opacity="1" marker-end="url(#arrow)"/></g><g><circle r="3.5" class="dot" fill="#22d3ee"><animateMotion id="j0_0" dur="0.6s" begin="0s;j0_4.end+0.6s" fill="freeze" path="M263.5 90 V142"/></circle><circle r="3.5" class="dot" fill="#22d3ee"><animateMotion id="j0_1" dur="1.2s" begin="j0_0.end+0.3s" fill="freeze" path="M263.5 202 V230 H133.5 V254"/></circle><circle r="3.5" class="dot" fill="#22d3ee"><animateMotion id="j0_2" dur="0.6s" begin="j0_1.end+0.3s" fill="freeze" path="M133.5 314 V342 H153 V366"/></circle><circle r="3.5" class="dot" fill="#22d3ee"><animateMotion id="j0_3" dur="1.1s" begin="j0_2.end+0.3s" fill="freeze" path="M153 426 V454 H263.5 V478"/></circle><circle r="3.5" class="dot" fill="#22d3ee"><animateMotion id="j0_4" dur="0.6s" begin="j0_3.end+0.3s" fill="freeze" path="M263.5 538 V590"/></circle><circle r="3.5" class="dot" fill="#fb7185"><animateMotion id="j1_0" dur="1.1s" begin="0s;j1_5.end+0.6s" fill="freeze" path="M263.5 202 V230 H383 V254"/></circle><circle r="3.5" class="dot" fill="#fb7185"><animateMotion id="j1_1" dur="0.6s" begin="j1_0.end+0.3s" fill="freeze" path="M383 314 V342 H388.5 V366"/></circle><circle r="3.5" class="dot" fill="#fb7185"><animateMotion id="j1_2" dur="1.2s" begin="j1_1.end+0.3s" fill="freeze" path="M388.5 426 V454 H263.5 V478"/></circle><circle r="3.5" class="dot" fill="#fb7185"><animateMotion id="j1_3" dur="0.6s" begin="j1_2.end+0.3s" fill="freeze" path="M263.5 538 V590"/></circle><circle r="3.5" class="dot" fill="#fb7185"><animateMotion id="j1_4" dur="0.6s" begin="j1_3.end+0.3s" fill="freeze" path="M263.5 650 V702"/></circle><circle r="3.5" class="dot" fill="#fb7185"><animateMotion id="j1_5" dur="0.6s" begin="j1_4.end+0.3s" fill="freeze" path="M263.5 762 V814"/></circle></g><g font-family="JetBrains Mono, ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" text-anchor="middle"><rect x="147" y="34" width="233" height="56" rx="8" fill="#0b1226" data-grp=""/><rect x="147" y="34" width="233" height="56" rx="8" fill="rgba(8,51,68,0.45)" stroke="#22d3ee" stroke-width="1.5" data-grp=""/><text x="263.5" y="57" fill="#e2e8f0" font-size="13" font-weight="500">TPS1 / TPS2 / BPS</text><text x="263.5" y="80" fill="#64748b" font-size="10">J1: throttle + brake sensors</text><rect x="169" y="146" width="189" height="56" rx="8" fill="#0b1226" data-grp=""/><rect x="169" y="146" width="189" height="56" rx="8" fill="rgba(6,78,59,0.45)" stroke="#34d399" stroke-width="1.5" data-grp=""/><text x="263.5" y="169" fill="#e2e8f0" font-size="13" font-weight="500">Protect + filter</text><text x="263.5" y="192" fill="#64748b" font-size="10">TVS / pull-downs / RC</text><rect x="34" y="258" width="199" height="56" rx="8" fill="#0b1226" data-grp=""/><rect x="34" y="258" width="199" height="56" rx="8" fill="rgba(6,78,59,0.45)" stroke="#34d399" stroke-width="1.5" data-grp=""/><text x="133.5" y="281" fill="#e2e8f0" font-size="13" font-weight="500">Sensor windows</text><text x="133.5" y="304" fill="#64748b" font-size="10">U2 / U4: V_THL to V_THH</text><rect x="273" y="258" width="220" height="56" rx="8" fill="#0b1226" data-grp=""/><rect x="273" y="258" width="220" height="56" rx="8" fill="rgba(6,78,59,0.45)" stroke="#34d399" stroke-width="1.5" data-grp=""/><text x="383" y="281" fill="#e2e8f0" font-size="13" font-weight="500">Brake + throttle</text><text x="383" y="304" fill="#64748b" font-size="10">U1: HB AND either TPS &gt;10%</text><rect x="48" y="370" width="210" height="56" rx="8" fill="#0b1226" data-grp=""/><rect x="48" y="370" width="210" height="56" rx="8" fill="rgba(136,19,55,0.45)" stroke="#fb7185" stroke-width="1.5" data-grp=""/><text x="153" y="393" fill="#e2e8f0" font-size="13" font-weight="500">100 ms qualification</text><text x="153" y="416" fill="#64748b" font-size="10">U3: one timer per sensor</text><rect x="298" y="370" width="181" height="56" rx="8" fill="#0b1226" data-grp=""/><rect x="298" y="370" width="181" height="56" rx="8" fill="rgba(136,19,55,0.45)" stroke="#fb7185" stroke-width="1.5" data-grp=""/><text x="388.5" y="393" fill="#e2e8f0" font-size="13" font-weight="500">1 s qualification</text><text x="388.5" y="416" fill="#64748b" font-size="10">U3: sustained HB&amp;10%</text><rect x="140.5" y="482" width="246" height="56" rx="8" fill="#0b1226" data-grp=""/><rect x="140.5" y="482" width="246" height="56" rx="8" fill="rgba(136,19,55,0.45)" stroke="#fb7185" stroke-width="1.5" data-grp=""/><text x="263.5" y="505" fill="#e2e8f0" font-size="13" font-weight="500">FAULT goes LOW</text><text x="263.5" y="528" fill="#64748b" font-size="10">Any qualified fault / wired OR</text><rect x="164.5" y="594" width="198" height="56" rx="8" fill="#0b1226" data-grp=""/><rect x="164.5" y="594" width="198" height="56" rx="8" fill="rgba(76,29,149,0.45)" stroke="#a78bfa" stroke-width="1.5" data-grp=""/><text x="263.5" y="617" fill="#e2e8f0" font-size="13" font-weight="500">Fault memory</text><text x="263.5" y="640" fill="#64748b" font-size="10">U5: clears Q; holds trip</text><rect x="138.5" y="706" width="250" height="56" rx="8" fill="#0b1226" data-grp=""/><rect x="138.5" y="706" width="250" height="56" rx="8" fill="rgba(136,19,55,0.45)" stroke="#fb7185" stroke-width="1.5" data-grp=""/><text x="263.5" y="729" fill="#e2e8f0" font-size="13" font-weight="500">Shutdown switch</text><text x="263.5" y="752" fill="#64748b" font-size="10">Q1 + Q2: remove SC_OUT supply</text><rect x="160" y="818" width="207" height="56" rx="8" fill="#0b1226" data-grp=""/><rect x="160" y="818" width="207" height="56" rx="8" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5" data-grp=""/><text x="263.5" y="841" fill="#e2e8f0" font-size="13" font-weight="500">Vehicle shutdown circuit</text><text x="263.5" y="864" fill="#64748b" font-size="10">J1 pin 5: SC_OUT</text></g><g font-family="JetBrains Mono, ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="11"><rect x="34" y="880" width="12" height="12" rx="3" fill="rgba(8,51,68,0.45)" stroke="#22d3ee"/><text x="52" y="890" fill="#94a3b8" font-size="11">sensors</text><rect x="145" y="880" width="12" height="12" rx="3" fill="rgba(6,78,59,0.45)" stroke="#34d399"/><text x="163" y="890" fill="#94a3b8" font-size="11">analog</text><rect x="248" y="880" width="12" height="12" rx="3" fill="rgba(136,19,55,0.45)" stroke="#fb7185"/><text x="266" y="890" fill="#94a3b8" font-size="11">trip</text><rect x="356" y="880" width="12" height="12" rx="3" fill="rgba(76,29,149,0.45)" stroke="#a78bfa"/><text x="374" y="890" fill="#94a3b8" font-size="11">latch</text><rect x="435" y="880" width="12" height="12" rx="3" fill="rgba(30,41,59,0.5)" stroke="#94a3b8"/><text x="453" y="890" fill="#94a3b8" font-size="11">vehicle</text><circle cx="549" cy="886" r="3.5" fill="#22d3ee"/><text x="559" y="890" fill="#94a3b8" font-size="11">signal flow</text></g></svg>